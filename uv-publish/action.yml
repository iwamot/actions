name: 'uv publish'
description: 'Checkout caller repo, build with uv, and publish to PyPI via Trusted Publishing'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false

    - name: Build
      shell: bash
      run: uv build

    - name: Publish
      shell: bash
      run: uv publish
