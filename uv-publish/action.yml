name: 'uv publish'
description: 'Checkout caller repo, build with uv, attest, and publish to PyPI via Trusted Publishing'

inputs:
  tag:
    description: 'Release tag to publish'
    required: false
    default: ${{ github.ref_name }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag }}
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: false

    - name: Build
      shell: bash
      run: uv build

    - name: Generate publish attestations
      uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
      with:
        paths: |
          dist/*.tar.gz
          dist/*.whl

    - name: Publish
      shell: bash
      run: uv publish
