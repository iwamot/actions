name: 'uv publish'
description: 'Checkout caller repo, build with uv, and publish to PyPI via Trusted Publishing'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: false

    - name: Build
      shell: bash
      run: uv build

    - name: Publish
      shell: bash
      run: uv publish
