name: 'uv publish'
description: 'Checkout caller repo, build with uv, and publish to PyPI via Trusted Publishing'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: false

    - name: Build
      shell: bash
      run: uv build

    - name: Publish
      shell: bash
      run: uv publish
