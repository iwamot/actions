name: 'uv publish'
description: 'Checkout caller repo, build with uv, and publish to PyPI via Trusted Publishing'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Setup uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: false

    - name: Build
      shell: bash
      run: uv build

    - name: Publish
      shell: bash
      run: uv publish
