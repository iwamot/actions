name: 'Docker merge and sign'
description: 'Merge per-platform digests into a manifest list, push it with semver and latest tags, then sign the image with cosign and attach an SBOM attestation.'

inputs:
  registry_image:
    description: 'Full image URI (e.g. public.ecr.aws/xxxxxxxx/namespace/repo or ghcr.io/owner/repo)'
    required: true

runs:
  using: composite
  steps:
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
      with:
        images: ${{ inputs.registry_image }}
        tags: |
          type=semver,pattern={{version}}

    - name: Create manifest list and push
      shell: bash
      working-directory: /tmp/digests
      env:
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
      run: |
        readarray -t tag_names < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
        tag_args=()
        for tag in "${tag_names[@]}"; do
          tag_args+=("-t" "$tag")
        done
        readarray -t digest_array < <(printf "${REGISTRY_IMAGE}@sha256:%s\n" *)
        docker buildx imagetools create "${tag_args[@]}" "${digest_array[@]}"

    - name: Get image digest
      id: digest
      shell: bash
      env:
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
        STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}
      run: |
        digest=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${STEPS_META_OUTPUTS_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

    - name: Sign the image
      shell: bash
      env:
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
        DIGEST: ${{ steps.digest.outputs.digest }}
      run: |
        cosign sign --yes "${REGISTRY_IMAGE}@${DIGEST}"

    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ inputs.registry_image }}@${{ steps.digest.outputs.digest }}
        format: spdx-json
        output-file: sbom.spdx.json
        upload-release-assets: false

    - name: Attest SBOM
      shell: bash
      env:
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
        DIGEST: ${{ steps.digest.outputs.digest }}
      run: |
        cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${REGISTRY_IMAGE}@${DIGEST}"
