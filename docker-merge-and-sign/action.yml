name: 'Docker merge and sign'
description: 'Merge per-platform digests into a manifest list, push it with semver and latest tags, sign the image with cosign, attach an SBOM attestation, and upload a SLSA build provenance attestation.'

inputs:
  registry_image:
    description: 'Full image URI (e.g. public.ecr.aws/xxxxxxxx/namespace/repo or ghcr.io/owner/repo)'
    required: true
  tags:
    description: 'Tags input forwarded to docker/metadata-action'
    required: false
    default: |
      type=semver,pattern={{version}}

runs:
  using: composite
  steps:
    - name: Download digests
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.registry_image }}
        tags: ${{ inputs.tags }}

    - name: Create manifest list and push
      shell: bash
      working-directory: /tmp/digests
      env:
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
      run: |
        readarray -t tag_names < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
        tag_args=()
        for tag in "${tag_names[@]}"; do
          tag_args+=("-t" "$tag")
        done
        readarray -t digest_array < <(printf "${REGISTRY_IMAGE}@sha256:%s\n" *)
        docker buildx imagetools create "${tag_args[@]}" "${digest_array[@]}"

    - name: Get image digest
      id: digest
      shell: bash
      env:
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
        STEPS_META_OUTPUTS_VERSION: ${{ steps.meta.outputs.version }}
      run: |
        digest=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${STEPS_META_OUTPUTS_VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign the image
      shell: bash
      env:
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
        DIGEST: ${{ steps.digest.outputs.digest }}
      run: |
        "${GITHUB_ACTION_PATH}/cosign-retry.sh" sign --yes "${REGISTRY_IMAGE}@${DIGEST}"

    - name: Generate SBOM
      uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
      with:
        image: ${{ inputs.registry_image }}@${{ steps.digest.outputs.digest }}
        format: spdx-json
        output-file: sbom.spdx.json
        upload-release-assets: false

    - name: Attest SBOM
      shell: bash
      env:
        REGISTRY_IMAGE: ${{ inputs.registry_image }}
        DIGEST: ${{ steps.digest.outputs.digest }}
      run: |
        "${GITHUB_ACTION_PATH}/cosign-retry.sh" attest --yes --predicate sbom.spdx.json --type spdxjson "${REGISTRY_IMAGE}@${DIGEST}"

    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.registry_image }}
        subject-digest: ${{ steps.digest.outputs.digest }}
