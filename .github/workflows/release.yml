name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: false
    uses: iwamot/workflows/.github/workflows/release-only.yml@866cf6089ddb88af6b479a14a4a78910b472b5f6 # v8.11.0
    permissions:
      contents: write  # to create the GitHub Release
