name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: false
    uses: iwamot/workflows/.github/workflows/release-only.yml@e5473d794269314bf1ef838dacfcc505c2cb239f # v8.14.0
    permissions:
      contents: write  # to create the GitHub Release
