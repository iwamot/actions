name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: false
    uses: iwamot/workflows/.github/workflows/release-only.yml@ba5efb9911ae0952fe1dee4d5c811fd85f345d52 # v8.12.0
    permissions:
      contents: write  # to create the GitHub Release
