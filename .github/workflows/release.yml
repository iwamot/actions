name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: false
    uses: iwamot/workflows/.github/workflows/release-only.yml@151b1bf39e0c30c80800f35de3f5aadbd859bae5 # v8.14.1
    permissions:
      contents: write  # to create the GitHub Release
