name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: false
    uses: iwamot/workflows/.github/workflows/release-only.yml@249b6cfa8fd90b7b58fcaab643e75f9e6cb078dc # v8.16.0
    with:
      tag: ${{ inputs.tag || '' }}
    permissions:
      contents: write  # to create the GitHub Release
