name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: false
    uses: iwamot/workflows/.github/workflows/release-only.yml@7b091fa5fb18e6dc84145fa54fd45ff94e139cd0 # v8.18.0
    with:
      tag: ${{ inputs.tag || '' }}
    permissions:
      checks: read  # allow the shared release workflow to inspect required CI
      statuses: read  # allow inspection of required legacy commit statuses
      contents: write  # to create the GitHub Release
