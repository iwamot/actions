name: 'npm publish'
description: 'Checkout caller repo, install with aube, set version from tag, build, and publish to npm with provenance'

inputs:
  tag:
    description: 'Release tag to publish'
    required: false
    default: ${{ github.ref_name }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag }}
        persist-credentials: false

    - name: Get mise version from mise.toml
      id: mise-version
      shell: bash
      # Assign first so a failure reading min_version fails the step instead of
      # writing an empty version, which mise-action treats as "latest".
      run: |
        v=$(python3 -c "import tomllib; print(tomllib.load(open('mise.toml','rb'))['min_version'])")
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Setup mise
      uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        version: ${{ steps.mise-version.outputs.version }}
        cache: false

    - name: Install dependencies
      shell: bash
      run: aube install --frozen-lockfile

    - name: Set version from tag
      env:
        TAG: ${{ inputs.tag }}
      shell: bash
      run: |
        VERSION="${TAG#v}"
        npm pkg set version="$VERSION"

    - name: Build
      shell: bash
      run: aube run build

    - name: Publish
      shell: bash
      run: npm publish --provenance --access public
