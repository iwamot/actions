name: 'npm publish'
description: 'Checkout caller repo, install with aube, set version from tag, build, and publish to npm with provenance'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Get mise version from mise.toml
      id: mise-version
      shell: bash
      # Assign first so a failure reading min_version fails the step instead of
      # writing an empty version, which mise-action treats as "latest".
      run: |
        v=$(python3 -c "import tomllib; print(tomllib.load(open('mise.toml','rb'))['min_version'])")
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ steps.mise-version.outputs.version }}
        cache: false

    - name: Install dependencies
      shell: bash
      run: aube install --frozen-lockfile

    - name: Set version from tag
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        npm pkg set version="$VERSION"

    - name: Build
      shell: bash
      run: aube run build

    - name: Publish
      shell: bash
      run: npm publish --provenance --access public
