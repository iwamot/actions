name: 'Docker build digest'
description: 'Build a Docker image for a single platform by digest and upload it as an artifact for later manifest merging.'

inputs:
  registry_image:
    description: 'Full image URI (e.g. public.ecr.aws/xxxxxxxx/namespace/repo or ghcr.io/owner/repo)'
    required: true
  platform:
    description: 'Target platform (e.g. linux/amd64)'
    required: true
  file:
    description: 'Path to the Dockerfile'
    required: false
    default: Dockerfile

runs:
  using: composite
  steps:
    - name: Prepare
      id: prepare
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        echo "platform_pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.registry_image }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ inputs.registry_image }},push-by-digest=true,name-canonical=true,push=true
        no-cache: true

    - name: Export digest
      shell: bash
      env:
        STEPS_BUILD_OUTPUTS_DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p /tmp/digests
        digest="${STEPS_BUILD_OUTPUTS_DIGEST}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digests-${{ steps.prepare.outputs.platform_pair }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
