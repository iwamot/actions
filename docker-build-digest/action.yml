name: 'Docker build digest'
description: 'Build a Docker image for a single platform by digest and upload it as an artifact for later manifest merging.'

inputs:
  registry_image:
    description: 'Full image URI (e.g. public.ecr.aws/xxxxxxxx/namespace/repo or ghcr.io/owner/repo)'
    required: true
  platform:
    description: 'Target platform (e.g. linux/amd64)'
    required: true
  file:
    description: 'Path to the Dockerfile'
    required: false
    default: Dockerfile

runs:
  using: composite
  steps:
    - name: Prepare
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
      with:
        images: ${{ inputs.registry_image }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,name=${{ inputs.registry_image }},push-by-digest=true,name-canonical=true,push=true
        no-cache: true

    - name: Export digest
      shell: bash
      env:
        STEPS_BUILD_OUTPUTS_DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p /tmp/digests
        digest="${STEPS_BUILD_OUTPUTS_DIGEST}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
