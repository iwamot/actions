name: 'release draft'
description: 'Create a draft GitHub Release for the pushed tag with auto-generated notes. Recreates the draft if one already exists for the tag.'

runs:
  using: composite
  steps:
    - name: Recreate draft Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        if STATE=$(gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null); then
          if [ "${STATE}" = "true" ]; then
            gh release delete "${TAG}" --yes
          else
            echo "Release ${TAG} is already published; refusing to recreate." >&2
            exit 1
          fi
        fi
        gh release create "${TAG}" --draft --generate-notes
