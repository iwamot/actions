name: 'go publish'
description: 'Checkout caller repo, set up mise, and run goreleaser release for the pushed tag.'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Get mise version from mise.toml
      id: mise-version
      shell: bash
      # Assign first so a failure reading min_version fails the step instead of
      # writing an empty version, which mise-action treats as "latest".
      run: |
        v=$(python3 -c "import tomllib; print(tomllib.load(open('mise.toml','rb'))['min_version'])")
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: ${{ steps.mise-version.outputs.version }}
        cache: false

    - name: Run goreleaser
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: goreleaser release --clean

    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: ./dist/checksums.txt
