name: 'go publish'
description: 'Checkout caller repo, set up mise, and run goreleaser release for the pushed tag.'

inputs:
  homebrew-tap-token:
    description: 'Token for pushing Homebrew formulae to a tap repository, exposed to goreleaser as HOMEBREW_TAP_TOKEN. Optional.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        cache: false

    - name: Run goreleaser
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        HOMEBREW_TAP_TOKEN: ${{ inputs.homebrew-tap-token }}
      run: goreleaser release --clean
