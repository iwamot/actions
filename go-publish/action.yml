name: 'go publish'
description: 'Checkout caller repo, set up mise, and run goreleaser release for the pushed tag.'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        cache: false

    - name: Run goreleaser
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: goreleaser release --clean
