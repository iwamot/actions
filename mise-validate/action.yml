name: 'Mise validate'
description: 'Checkout caller repo, setup mise from mise.toml, and run validate.sh'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Get mise version from mise.toml
      id: mise-version
      shell: bash
      # Assign first so a failure reading min_version fails the step instead of
      # writing an empty version, which mise-action treats as "latest".
      run: |
        v=$(python3 -c "import tomllib; print(tomllib.load(open('mise.toml','rb'))['min_version'])")
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Setup mise
      uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        version: ${{ steps.mise-version.outputs.version }}

    - name: Run validation script
      shell: bash
      env:
        # Authenticate GitHub API calls (e.g. pinact verifying SHA pins) to lift
        # the 60 req/hour unauthenticated rate limit shared across runner IPs.
        GITHUB_TOKEN: ${{ github.token }}
      run: bash validate.sh
