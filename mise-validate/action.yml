name: 'Mise validate'
description: 'Checkout caller repo, setup mise from mise.toml, and run validate.sh'

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    - name: Get mise version from mise.toml
      shell: bash
      run: echo "MISE_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('mise.toml','rb'))['min_version'])")" >> "$GITHUB_ENV"

    - name: Setup mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      with:
        version: ${{ env.MISE_VERSION }}

    - name: Run validation script
      shell: bash
      env:
        # Authenticate GitHub API calls (e.g. pinact verifying SHA pins) to lift
        # the 60 req/hour unauthenticated rate limit shared across runner IPs.
        GITHUB_TOKEN: ${{ github.token }}
      run: bash validate.sh
